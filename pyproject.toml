[project]
name = "clipper"
version = "0.1.0"
description = "Long-form video to YouTube Shorts clipping pipeline"
authors = [{ name = "omoinjm" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "auto-editor>=29.3.1",
    "boto3>=1.44.3",
    "botocore[crt]>=1.44.3",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scenedetect[opencv]>=0.7.3",
    "typer>=0.29.1",
    "whisperx>=3.8.6",
    "yt-dlp[default]>=2026.10.26",  # [default] brings yt-dlp-ejs, the YouTube challenge solver
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
clipper = "clipper.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
]
